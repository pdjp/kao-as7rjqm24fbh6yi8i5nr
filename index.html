<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:32px 24px;background:#1d2b45;color:#f3eee4;font-family:"Noto Serif JP",serif;text-align:center}
  .box{width:100%;max-width:340px}
  .en{font-family:"Cormorant Garamond",serif;font-size:.9rem;letter-spacing:.4em;color:#d8c39a}

  input:focus{outline:2px solid #d8c39a;outline-offset:1px}
  .row{display:flex;align-items:center;gap:8px;font-size:.78rem;color:#c9cfdb}
  .row input{width:18px;height:18px;accent-color:#d8c39a}

  button:disabled{opacity:.6}
  .msg{min-height:1.6em;font-size:.82rem;color:#f2b8b8;text-align:center}

</style>

  var KEY='kao-pass-v1';
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function norm(s){return s.normalize('NFKC').trim().toLowerCase().replace(/\s+/g,' ');}
  async function open(pass){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(norm(pass)),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.data));
    return new TextDecoder().decode(plain);
  }
  function show(html){document.open();document.write(html);document.close();}
  var f=document.getElementById('f'),pw=document.getElementById('pw'),msg=document.getElementById('msg'),go=document.getElementById('go');
  document.getElementById('show').addEventListener('change',function(e){pw.type=e.target.checked?'text':'password';});
  f.addEventListener('submit',async function(e){
    e.preventDefault();
    go.disabled=true;go.textContent='確認中…';msg.textContent='';
    try{
      var html=await open(pw.value);
      if(document.getElementById('keep').checked){try{localStorage.setItem(KEY,pw.value);}catch(_){}}
      show(html);
    }catch(err){
      msg.textContent='合言葉が違うようです。もう一度お試しください。';
      go.disabled=false;go.textContent='ひらく';pw.select();
    }
  });
  var saved=null;try{saved=localStorage.getItem(KEY);}catch(_){}
  if(saved){open(saved).then(show).catch(function(){try{localStorage.removeItem(KEY);}catch(_){}});}
